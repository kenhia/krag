[project]
name = "krag"
version = "0.1.0"
description = "Personal Multimodal RAG System - Phase 1: Text indexing and retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Ken Hiatt", email = "ken.hiatt@gmail.com" }
]
dependencies = [
    "typer>=0.9.0",
    "sentence-transformers>=2.3.0",
    "qdrant-client>=1.8.0",
    "llama-cpp-python>=0.2.90",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
    "pyyaml>=6.0.1",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.34.0",
    "ruff>=0.15.0",
    "krag-plugin-code @ file://${PROJECT_ROOT}/examples/krag-plugin-code",
    "krag-plugin-logs @ file://${PROJECT_ROOT}/examples/krag-plugin-logs",
    "krag-plugin-markdown @ file://${PROJECT_ROOT}/examples/krag-plugin-markdown",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
krag = "krag_cli.main:app"
kragd = "kragd.__main__:app"
krag-direct = "krag.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"  # Can use py313 features when ready
exclude = ["tests/fixtures/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # typer.Option in function arguments is the intended pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/krag --cov=src/kragd --cov=src/krag_cli --cov-report=html --cov-report=term -m 'not live'"
markers = [
    "live: tests that require a running kragd service (deselected by default, run with -m live)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict = true
