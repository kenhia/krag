[project]
name = "krag-plugin-markdown"
version = "1.0.0"
description = "krag plugin for Markdown files with frontmatter support"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "krag Plugin Team", email = "plugins@krag.dev"}
]
keywords = ["krag", "plugin", "markdown", "md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "krag",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.12.0",
]

[project.entry-points."krag.plugins"]
markdown = "krag_plugin_markdown.handler:MarkdownFileTypeHandler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
